services:

  # מסד הנתונים של האפליקציה, ורק backend מדבר איתו.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shoplist
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shoplist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ה-API של המוצרים ב-Flask, שמדבר עם postgres ומקבל בקשות מ-stats ומ-frontend.
  backend:
    build:
      context: ../app/backend
    environment:
      DB_HOST: postgres
      DB_NAME: shoplist
      DB_USER: shopuser
      DB_PASSWORD: shoppass
    depends_on:
      postgres:
        condition: service_healthy

  # שירות הסטטיסטיקות ב-Node.js, שמבקש את המוצרים מ-backend ומקבל בקשות מ-frontend.
  stats:
    build:
      context: ../app/stats
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend

  # שרת Nginx שמגיש את האתר לדפדפן ומעביר בקשות API אל backend ואל stats.
  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile.multistage
    ports:
      - "8080:80"
    depends_on:
      - backend
      - stats

volumes:
  postgres-data:
